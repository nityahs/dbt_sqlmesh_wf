name: SQLMesh CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  sqlmesh:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}

      - name: Install SQLMesh
        run: |
          pip install --upgrade pip
          pip install "sqlmesh[dbt,duckdb]" dbt-duckdb

      # NOTE: `sqlmesh init dbt` reads your EXISTING dbt_project.yml/models
      # and generates a sqlmesh.yaml + config.py pointing at them — it does
      # not touch your dbt SQL. This is typically a ONE-TIME step you run
      # locally and commit (sqlmesh.yaml, config.py) rather than re-run on
      # every CI job. If those files are already committed, delete this step.
      - name: sqlmesh init (dbt project)
        run: sqlmesh init -t dbt

      - name: Debug - verify profiles.yml location
        run: |
          echo "DBT_PROFILES_DIR is: $DBT_PROFILES_DIR"
          echo "--- repo root contents ---"
          ls -la
          echo "--- profiles dir contents ---"
          ls -la profiles || echo "profiles/ directory does not exist"
          echo "--- looking for dbt_project.yml ---"
          find . -name "dbt_project.yml" -not -path "*/node_modules/*"

      # plan.py should apply the SQLMesh plan (Context.plan(auto_apply=True))
      # BEFORE `sqlmesh run`, since `run` executes against an environment
      # that a plan must have already created. Confirm plan.py does this,
      # or reorder these two steps to match what plan.py actually does.
      - name: Run plan.py
        run: python plan.py
      - name: Upload Column Lineage artifact
        uses: actions/upload-artifact@v4
        with: 
          path: column_lineage.json
      - name: Download column lineage artifact
        uses: actions/download-artifact@v4
        with:
          name: column-lineage
          path: column_lineage.json

      - name: sqlmesh plan
        run: sqlmesh plan --auto-apply
      - name: Query SQLMesh model
        shell: python
        run: |
          from sqlmesh import Context
          context = Context(paths=".")
          df = context.fetchdf("select * from full_model")
          print(df)
